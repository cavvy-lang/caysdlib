[package]
name = "test_caysdlib"
version = "0.1.0"
description = "A Cavvy project"
authors = []
license = "MIT"
# project_type = "bin"  # bin（可执行）或 lib（库）
main = "main.cay"
src_dir = "src"
target_dir = "target"

[build]
opt_level = "2"
debug = false
static_link = false
# target = "x86_64-w64-mingw32"
cflags = []
ldflags = []
lib_paths = []
libs = []
lto = false
opt_ir = false
keep_ir = false

[ffi]
# 系统库，如 "user32", "kernel32" (Windows) 或 "m", "pthread" (Linux)
system_libs = []
include_paths = []
link_options = []

# 第三方库配置示例
