# deps = ["SDL2main"]
#
# [ffi.libraries.sdl2.platform.windows]
# lib = "SDL2"
# path = "C:/SDL2/lib"
# ldflags = ["-lSDL2main", "-lSDL2"]
#
# [ffi.libraries.sdl2.platform.linux]
# lib = "SDL2"
# path = "/usr/lib/x86_64-linux-gnu"

[workspace]
# 本地库项目路径列表
